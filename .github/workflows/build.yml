name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "v1.0"
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: true

      - name: Validate subscription manager integration
        run: |
          test -s combined_refactor/subscriptions.go
          test -s singbox-r-template.json
          grep -Fq '"subscription_list":' combined_refactor/server.go
          grep -Fq '"subscription_get":' combined_refactor/server.go
          grep -Fq '"subscription_save":' combined_refactor/server.go
          grep -Fq '"subscription_update":' combined_refactor/server.go
          grep -Fq '"subscription_delete":' combined_refactor/server.go
          grep -Fq 'id="btnSubscriptions"' combined_refactor/index.html
          grep -Fq "case 'subscription_list':" combined_refactor/index.html
          grep -Fq "case 'subscription_detail':" combined_refactor/index.html
          grep -Fq "type: 'subscription_update'" combined_refactor/index.html
          grep -Fq "type: 'subscription_delete'" combined_refactor/index.html
          echo "Subscription manager integration checks passed."

      - name: Create Release Assets Directory
        run: mkdir -p release_assets

      - name: Set Build Time
        id: set-build-time
        run: |
          build_time=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S %z')
          echo "BUILD_TIME=$build_time" >> $GITHUB_OUTPUT

      - name: Set Version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download CA Certificates
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            -o combined_refactor/ca-certificates.crt
          cert_count=$(grep -c "BEGIN CERTIFICATE" combined_refactor/ca-certificates.crt || true)
          echo "Downloaded ${cert_count} CA certificates before build."

      - name: Build
        run: |
          ext="${{ matrix.ext || '' }}"
          filename="cfdata-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          echo "Building ${filename}..."
          cd combined_refactor
          go build -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" -o ../release_assets/${filename} .
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"

      - name: Generate SHA256
        run: |
          cd release_assets
          for file in *.sha256; do rm -f "$file"; done
          for file in $(find . -type f ! -name '*.sha256'); do
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}
          path: release_assets/*

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache-dependency-path: combined_refactor/go.sum

      # Do not let setup-android try to install the removed legacy "tools" package.
      # Install only the SDK command-line tools here; required SDK packages are
      # installed explicitly in the next step.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set Version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download CA Certificates
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            -o combined_refactor/ca-certificates.crt

      - name: Validate subscription manager integration
        run: |
          test -s combined_refactor/subscriptions.go
          grep -Fq '"subscription_list":' combined_refactor/server.go
          grep -Fq '"subscription_get":' combined_refactor/server.go
          grep -Fq '"subscription_save":' combined_refactor/server.go
          grep -Fq '"subscription_update":' combined_refactor/server.go
          grep -Fq '"subscription_delete":' combined_refactor/server.go
          grep -Fq 'id="btnSubscriptions"' combined_refactor/index.html
          echo "Subscription manager integration checks passed for Android build."

      - name: Install latest reF1nd Android ARM64 binary from project-root ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # The project convention is a single root-level archive named sing-box.zip.
          # Do not execute the Android ARM64 binary on the x86_64 GitHub runner.
          archive="sing-box.zip"
          if [ ! -f "$archive" ]; then
            archives=(singboxr*.zip sing-boxr*.zip singbox*.zip sing-box*.zip)
            if [ "${#archives[@]}" -eq 0 ]; then
              echo "未找到 sing-box.zip。请把最新 reF1nd Android ARM64 核心 ZIP 放在项目根目录，并命名为 sing-box.zip。" >&2
              exit 1
            fi
            archive="$(printf '%s\n' "${archives[@]}" | xargs -r ls -1t | head -n 1)"
          fi
          [ -f "$archive" ] || { echo "无法选择 sing-box 核心 ZIP。" >&2; exit 1; }
          echo "Using sing-box archive: ${archive}"

          extract_dir="$RUNNER_TEMP/cfdata-singboxr"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"

          candidate=""
          # Prefer the expected file name, then fall back to any ARM64 ELF.
          expected="$extract_dir/sing-box"
          if [ -f "$expected" ] && file "$expected" | grep -Eq 'ELF 64-bit.*(ARM aarch64|AArch64|LSB.*aarch64)'; then
            candidate="$expected"
          else
            while IFS= read -r -d '' file_path; do
              if file "$file_path" | grep -Eq 'ELF 64-bit.*(ARM aarch64|AArch64|LSB.*aarch64)'; then
                candidate="$file_path"
                break
              fi
            done < <(find "$extract_dir" -type f -print0)
          fi

          if [ -z "$candidate" ]; then
            echo "ZIP 中没有检测到 Android ARM64 ELF 二进制。" >&2
            find "$extract_dir" -maxdepth 4 -type f -print >&2 || true
            exit 1
          fi

          chmod +x "$candidate"
          echo "Selected binary: $candidate"
          file "$candidate"
          file "$candidate" | grep -Eq 'ELF 64-bit.*(ARM aarch64|AArch64|LSB.*aarch64)'

          mkdir -p app/src/main/assets
          cp "$candidate" app/src/main/assets/sing-box-android-arm64
          chmod +x app/src/main/assets/sing-box-android-arm64

          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          binary_sha256="$(sha256sum "$candidate" | awk '{print $1}')"
          echo "Archive SHA256: ${archive_sha256}"
          echo "Binary SHA256: ${binary_sha256}"
          echo "Bundled Android ARM64 sing-box core (validated only; never executed on x86_64 runner)."

          test -s singbox-engine.json
          test -s singbox-r-template.json
          python3 - <<'PY'
          import json
          for path in ("singbox-engine.json", "singbox-r-template.json"):
              with open(path, "r", encoding="utf-8") as f:
                  json.load(f)
              print("JSON OK:", path)
          PY
          cp singbox-engine.json app/src/main/assets/singbox-engine.json
          cp singbox-r-template.json app/src/main/assets/singbox-r-template.json
          chmod 644 app/src/main/assets/sing-box-android-arm64
          cat > app/src/main/assets/sing-box-android-arm64.version <<EOF
          archive=$(basename "$archive")
          archive_sha256=${archive_sha256}
          binary_sha256=${binary_sha256}
          architecture=arm64-v8a
          EOF
          chmod 644 app/src/main/assets/sing-box-android-arm64.version
          ls -lh app/src/main/assets/sing-box-android-arm64 app/src/main/assets/singbox-engine.json app/src/main/assets/singbox-r-template.json

      - name: Build Android backend
        working-directory: combined_refactor
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" -o ../app/src/main/jniLibs/arm64-v8a/libcfdata.so .

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD_SECRET" ] && \
             [ -n "$ANDROID_KEY_ALIAS_SECRET" ] && \
             [ -n "$ANDROID_KEY_PASSWORD_SECRET" ]; then
            keystore_file="$RUNNER_TEMP/cfdata-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_file"
            chmod 600 "$keystore_file"
            {
              echo "ANDROID_KEYSTORE_FILE=$keystore_file"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
            echo "Using configured Android release keystore."
          else
            echo "Android signing secrets are not fully configured; generating a temporary CI signing key."
            keystore_file="$RUNNER_TEMP/cfdata-ci-release.keystore"
            ci_password="${GITHUB_RUN_ID}-cfdata"
            key_alias="cfdata-ci"

            keytool -genkeypair \
              -v \
              -keystore "$keystore_file" \
              -storepass "$ci_password" \
              -keypass "$ci_password" \
              -alias "$key_alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=CFData-WEB CI, OU=Build, O=CFData-WEB, C=US"

            chmod 600 "$keystore_file"
            {
              echo "ANDROID_KEYSTORE_FILE=$keystore_file"
              echo "ANDROID_KEYSTORE_PASSWORD=$ci_password"
              echo "ANDROID_KEY_ALIAS=$key_alias"
              echo "ANDROID_KEY_PASSWORD=$ci_password"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.set-version.outputs.VERSION }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK Contains Backend
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libcfdata.so" apk-contents.txt
          unzip -l app/build/outputs/apk/release/app-release.apk "lib/arm64-v8a/libcfdata.so"

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/cfdata-android-arm64.apk
          cd release_assets
          sha256sum cfdata-android-arm64.apk | awk '{print $1}' > cfdata-android-arm64.apk.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-android-arm64-apk
          path: release_assets/*

  release:
    name: Release
    needs: [build, android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Get version
        id: get-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Get build time
        id: get-time
        run: |
          build_time=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S %z')
          echo "BUILD_TIME=$build_time" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.VERSION }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' || contains(steps.get-version.outputs.VERSION, '-') }}
        run: |
          git fetch --tags --force

          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft == false and .tag_name != env.VERSION and (env.CURRENT_PRERELEASE == "true" or .prerelease == false))][0].tag_name // ""')"

          if [ -n "$previous_tag" ] && git rev-parse "$previous_tag^{commit}" >/dev/null 2>&1; then
            changelog="$(git log --no-merges --pretty=format:'- %s (%h)' "$previous_tag..$CURRENT_SHA")"
            if [ -z "$changelog" ]; then
              changelog="- 本次没有新增提交"
            fi
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${VERSION}"
            compare_link="[${previous_tag}...${VERSION}](${compare_url})"
          else
            previous_tag=""
            compare_url=""
            compare_link="无"
            changelog="- 首次发布，未找到上一个 Release 基准"
          fi

          {
            echo "PREVIOUS_TAG=$previous_tag"
            echo "COMPARE_URL=$compare_url"
            echo "COMPARE_LINK=$compare_link"
            echo "CHANGELOG<<EOF"
            printf '%s\n' "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: "CFData-WEB Release ${{ steps.get-version.outputs.VERSION }}"
          body: |
            ## ${{ steps.get-version.outputs.VERSION }} 发布说明

            构建时间：${{ steps.get-time.outputs.BUILD_TIME }}

            构建方式：GitHub Actions

            上一个版本：${{ steps.changelog.outputs.PREVIOUS_TAG || '无' }}

            对比变更：${{ steps.changelog.outputs.COMPARE_LINK }}

            ### 本次变更

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            采用 GitHub Actions 自动构建。

            支持 macOS / Windows / Linux（ARM64、AMD64）。

            支持 Android（ARM64 APK）。
          files: artifacts/*
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' || contains(steps.get-version.outputs.VERSION, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
