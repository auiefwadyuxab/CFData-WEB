name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "v1.0"
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.8"
  GOTOOLCHAIN: "local"
  REF1ND_RELEASE_INFO_URL: "https://raw.githubusercontent.com/reF1nd/sing-box-releases/dev/testing-build-info.json"

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: combined_refactor/go.sum

      - name: Validate sing-box R subscription integration
        run: |
          set -euo pipefail
          test -s combined_refactor/subscriptions.go
          test -s combined_refactor/singbox.go
          test -s combined_refactor/server.go
          test -s app/src/main/assets/singbox-r-template.json
          grep -Fq 'id="btnSingBoxR"' combined_refactor/index.html
          grep -Fq 'id="singboxRControls"' combined_refactor/index.html
          grep -Fq 'cfdataSingBoxPanel' app/src/main/assets/singbox-ui.js
          grep -Fq 'singBoxTrueLatencyTest' app/src/main/assets/singbox-ui.js
          grep -Fq 'singBoxTrueSpeedTest' app/src/main/assets/singbox-ui.js
          grep -Fq 'CFDataTrueLatencyTest' third_party/ref1nd-libbox-overrides/daemon/cfdata_true_test.go
          grep -Fq 'CFDataTrueSpeedTest' third_party/ref1nd-libbox-overrides/daemon/cfdata_true_test.go
          grep -Fq 'handleSingBoxDiagnosticsAPI' combined_refactor/singbox.go
          grep -Fq 'Provider1.update.log' combined_refactor/singbox.go
          if grep -Eq 'id="btnSubscriptions"|subscriptionControls|subscriptionUserAgent' combined_refactor/index.html; then
            echo "旧订阅管理 UI 入口仍存在" >&2
            exit 1
          fi
          if grep -Eq '"subscription_(list|get|save|update|delete)"' combined_refactor/server.go; then
            echo "旧订阅 WebSocket 入口仍存在" >&2
            exit 1
          fi
          test -s third_party/ref1nd-libbox-overrides/daemon/cfdata_true_test.go
          test -s third_party/ref1nd-libbox-overrides/experimental/libbox/cfdata.go
          echo "sing-box R subscription integration checks passed."

      - name: Create Release Assets Directory
        run: mkdir -p release_assets

      - name: Set Build Time
        id: set-build-time
        run: |
          build_time=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S %z')
          echo "BUILD_TIME=$build_time" >> $GITHUB_OUTPUT

      - name: Set Version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download CA Certificates
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            -o combined_refactor/ca-certificates.crt
          cert_count=$(grep -c "BEGIN CERTIFICATE" combined_refactor/ca-certificates.crt || true)
          echo "Downloaded ${cert_count} CA certificates before build."

      - name: Build
        run: |
          ext="${{ matrix.ext || '' }}"
          filename="cfdata-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          echo "Building ${filename}..."
          cd combined_refactor
          go build -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" -o ../release_assets/${filename} .
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"

      - name: Generate SHA256
        run: |
          cd release_assets
          for file in *.sha256; do rm -f "$file"; done
          for file in $(find . -type f ! -name '*.sha256'); do
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}
          path: release_assets/*

  resolve-ref1nd-testing:
    name: Resolve latest reF1nd testing source
    runs-on: ubuntu-26.04
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve current testing build metadata
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          info="$RUNNER_TEMP/ref1nd-testing-build-info.json"
          curl -fsSL --retry 4 --connect-timeout 10 \
            "$REF1ND_RELEASE_INFO_URL" -o "$info"
          jq -e '(.version | type == "string") and (.source_sha | test("^[0-9a-f]{40}$"))' "$info" >/dev/null
          source_sha=$(jq -r '.source_sha' "$info")
          version=$(jq -r '.version' "$info")
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest reF1nd testing build: $version"
          echo "Source SHA: $source_sha"
          cat "$info"

  build-ref1nd-libbox:
    name: Build reF1nd Libbox AAR (Android arm64)
    runs-on: ubuntu-26.04
    needs: resolve-ref1nd-testing
    steps:
      - name: Checkout CFData source
        uses: actions/checkout@v7

      - name: Checkout reF1nd sing-box source
        uses: actions/checkout@v7
        with:
          repository: reF1nd/sing-box
          ref: ${{ needs.resolve-ref1nd-testing.outputs.source_sha }}
          path: ref1nd-sing-box
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ref1nd-sing-box/go.sum

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build source-backed Libbox
        shell: bash
        run: |
          set -euo pipefail
          cd ref1nd-sing-box
          test "$(git rev-parse HEAD)" = "${{ needs.resolve-ref1nd-testing.outputs.source_sha }}"
          required_go=$(awk '$1 == "go" {print $2; exit}' go.mod)
          test -n "$required_go"
          if [ "$(printf '%s\n' "$required_go" "$GO_VERSION" | sort -V | head -1)" != "$required_go" ]; then
            echo "reF1nd source requires Go $required_go, but CI provides $GO_VERSION" >&2
            exit 1
          fi
          echo "reF1nd source requires Go >= $required_go; CI uses $GO_VERSION"
          make lib_install
          export PATH="$(go env GOPATH)/bin:$PATH"
          cp "$GITHUB_WORKSPACE/third_party/ref1nd-libbox-overrides/daemon/cfdata_true_test.go" daemon/cfdata_true_test.go
          cp "$GITHUB_WORKSPACE/third_party/ref1nd-libbox-overrides/experimental/libbox/cfdata.go" experimental/libbox/cfdata.go
          gofmt -w daemon/cfdata_true_test.go experimental/libbox/cfdata.go
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          test -s libbox.aar
          test -s libbox-legacy.aar
          mkdir -p "$RUNNER_TEMP/ref1nd-aar"
          cp libbox.aar libbox-legacy.aar "$RUNNER_TEMP/ref1nd-aar/"
          ls -lh "$RUNNER_TEMP/ref1nd-aar/"

      - name: Upload Libbox AAR
        uses: actions/upload-artifact@v7
        with:
          name: ref1nd-libbox-arm64
          path: ${{ runner.temp }}/ref1nd-aar/*
          compression-level: 0

  android-apk:
    name: Android APK
    runs-on: ubuntu-26.04
    needs: [resolve-ref1nd-testing, build-ref1nd-libbox]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: combined_refactor/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-37.1
            build-tools;37.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set Version
        id: set-version
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Download CA Certificates
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            -o combined_refactor/ca-certificates.crt
          test -s combined_refactor/ca-certificates.crt

      - name: Validate CFData / reF1nd integration
        shell: bash
        run: |
          set -euo pipefail
          test -s combined_refactor/subscriptions.go
          test -s combined_refactor/singbox.go
          test -s combined_refactor/server.go
          test -s app/src/main/assets/singbox-r-template.json
          test -s app/src/main/assets/singbox-engine.json
          test ! -e app/libs/libbox.aar
          grep -Fq 'id="btnSingBoxR"' combined_refactor/index.html
          grep -Fq 'id="singboxRControls"' combined_refactor/index.html
          grep -Fq 'cfdataSingBoxPanel' app/src/main/assets/singbox-ui.js
          grep -Fq 'singBoxTrueLatencyTest' app/src/main/assets/singbox-ui.js
          grep -Fq 'singBoxTrueSpeedTest' app/src/main/assets/singbox-ui.js
          grep -Fq 'CFDataTrueLatencyTest' third_party/ref1nd-libbox-overrides/daemon/cfdata_true_test.go
          grep -Fq 'CFDataTrueSpeedTest' third_party/ref1nd-libbox-overrides/daemon/cfdata_true_test.go
          grep -Fq 'handleSingBoxDiagnosticsAPI' combined_refactor/singbox.go
          grep -Fq 'Provider1.update.log' combined_refactor/singbox.go
          if grep -Eq 'id="btnSubscriptions"|subscriptionControls|subscriptionUserAgent' combined_refactor/index.html; then
            echo "旧订阅管理 UI 入口仍存在" >&2
            exit 1
          fi
          if grep -Eq '"subscription_(list|get|save|update|delete)"' combined_refactor/server.go; then
            echo "旧订阅 WebSocket 入口仍存在" >&2
            exit 1
          fi
          if grep -RInE 'CFDataTrueTest' third_party/ref1nd-libbox-overrides; then
            echo "旧的合并式 CFDataTrueTest override 仍存在" >&2
            exit 1
          fi
          if grep -RInE 'su -c|findSuBinary|libsingbox|CFDATA_SINGBOX_PATH' app/src/main/java/com/cfdata/web/singbox app/src/main/java/com/cfdata/web/MainActivity.java; then
            echo "Android 真连接路径仍包含旧 standalone/root 启动逻辑" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          for path in (
              'app/src/main/assets/singbox-engine.json',
              'app/src/main/assets/singbox-r-template.json',
          ):
              with open(path, 'r', encoding='utf-8') as f:
                  json.load(f)
              print('JSON OK:', path)
          PY

      - name: Download source-built Libbox
        uses: actions/download-artifact@v8
        with:
          name: ref1nd-libbox-arm64
          path: ref1nd-aar

      - name: Install Libbox AAR
        shell: bash
        run: |
          set -euo pipefail
          test -s ref1nd-aar/libbox.aar
          mkdir -p app/libs
          cp ref1nd-aar/libbox.aar app/libs/libbox.aar
          ls -lh app/libs/libbox.aar

      - name: Build Android backend
        working-directory: combined_refactor
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" \
            -o ../app/src/main/jniLibs/arm64-v8a/libcfdata.so .
          test -s ../app/src/main/jniLibs/arm64-v8a/libcfdata.so

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD_SECRET" ] && \
             [ -n "$ANDROID_KEY_ALIAS_SECRET" ] && \
             [ -n "$ANDROID_KEY_PASSWORD_SECRET" ]; then
            keystore_file="$RUNNER_TEMP/cfdata-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_file"
            chmod 600 "$keystore_file"
            {
              echo "ANDROID_KEYSTORE_FILE=$keystore_file"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
            echo "Using configured Android release keystore."
          else
            echo "Android signing secrets are not fully configured; generating a temporary CI signing key."
            keystore_file="$RUNNER_TEMP/cfdata-ci-release.keystore"
            ci_password="${GITHUB_RUN_ID}-cfdata"
            key_alias="cfdata-ci"
            keytool -genkeypair \
              -v \
              -keystore "$keystore_file" \
              -storepass "$ci_password" \
              -keypass "$ci_password" \
              -alias "$key_alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=CFData-WEB CI, OU=Build, O=CFData-WEB, C=US"
            chmod 600 "$keystore_file"
            {
              echo "ANDROID_KEYSTORE_FILE=$keystore_file"
              echo "ANDROID_KEYSTORE_PASSWORD=$ci_password"
              echo "ANDROID_KEY_ALIAS=$key_alias"
              echo "ANDROID_KEY_PASSWORD=$ci_password"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.set-version.outputs.VERSION }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Contains Backend and Libbox
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libcfdata.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libbox.so" apk-contents.txt

      - name: Prepare APK Assets and Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/cfdata-android-arm64.apk
          printf '{\n  "cfdata_version": "%s",\n  "ref1nd_testing_version": "%s",\n  "ref1nd_source_sha": "%s"\n}\n' \
            "${{ steps.set-version.outputs.VERSION }}" \
            "${{ needs.resolve-ref1nd-testing.outputs.version }}" \
            "${{ needs.resolve-ref1nd-testing.outputs.source_sha }}" \
            > release_assets/cfdata-android-arm64.build-info.json
          cd release_assets
          sha256sum cfdata-android-arm64.apk | awk '{print $1}' > cfdata-android-arm64.apk.sha256
          cat cfdata-android-arm64.build-info.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-android-arm64-apk
          path: release_assets/*

  release:
    name: Release
    needs: [build, android-apk]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Get version
        id: get-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Get build time
        id: get-time
        run: |
          build_time=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S %z')
          echo "BUILD_TIME=$build_time" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.VERSION }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' || contains(steps.get-version.outputs.VERSION, '-') }}
        run: |
          git fetch --tags --force

          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft == false and .tag_name != env.VERSION and (env.CURRENT_PRERELEASE == "true" or .prerelease == false))][0].tag_name // ""')"

          if [ -n "$previous_tag" ] && git rev-parse "$previous_tag^{commit}" >/dev/null 2>&1; then
            changelog="$(git log --no-merges --pretty=format:'- %s (%h)' "$previous_tag..$CURRENT_SHA")"
            if [ -z "$changelog" ]; then
              changelog="- 本次没有新增提交"
            fi
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${VERSION}"
            compare_link="[${previous_tag}...${VERSION}](${compare_url})"
          else
            previous_tag=""
            compare_url=""
            compare_link="无"
            changelog="- 首次发布，未找到上一个 Release 基准"
          fi

          {
            echo "PREVIOUS_TAG=$previous_tag"
            echo "COMPARE_URL=$compare_url"
            echo "COMPARE_LINK=$compare_link"
            echo "CHANGELOG<<EOF"
            printf '%s\n' "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: "CFData-WEB Release ${{ steps.get-version.outputs.VERSION }}"
          body: |
            ## ${{ steps.get-version.outputs.VERSION }} 发布说明

            构建时间：${{ steps.get-time.outputs.BUILD_TIME }}

            构建方式：GitHub Actions

            上一个版本：${{ steps.changelog.outputs.PREVIOUS_TAG || '无' }}

            对比变更：${{ steps.changelog.outputs.COMPARE_LINK }}

            ### 本次变更

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            采用 GitHub Actions 自动构建。

            支持 macOS / Windows / Linux（ARM64、AMD64）。

            支持 Android（ARM64 APK）。
          files: artifacts/*
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' || contains(steps.get-version.outputs.VERSION, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
